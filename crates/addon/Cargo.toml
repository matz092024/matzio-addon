[package]
name = "matzio-addon"
description = "Stremio addon HTTP server used by the Matzio tray app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "multipart", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
axum = { version = "0.8", features = ["macros"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }
tower = { version = "0.5", features = ["util"] }
