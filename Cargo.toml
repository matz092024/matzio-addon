[workspace]
members = ["crates/addon", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"

[profile.release]
# Small binary and low memory footprint matter more than peak speed here.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
